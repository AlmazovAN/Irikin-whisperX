name: CI

on:
  workflow_dispatch:
    inputs:
      run_heavy:
        description: "Run legacy integration tests (large dependencies, network and models)"
        type: boolean
        required: true
        default: false
  push:
    branches:
      - master
      - intel-gpu
  # Stacked PRs target feature branches; fast checks must run on those too.
  pull_request:

jobs:
  fast-checks:
    name: Fast offline checks / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install lightweight test runner
        run: python -m pip install pytest
      - name: Check Python syntax (no imports or model downloads)
        run: python -m compileall -q app.py backend modules scripts tests
      - name: Check shell script syntax
        run: bash -n Install.sh start-webui.sh
      - name: Run offline unit tests only
        run: python -m pytest -q tests/unit

  # Legacy integration tests are intentionally opt-in. They install the full
  # inference stack and may download audio, models or other external resources.
  legacy-webui:
    name: Legacy WebUI / Python ${{ matrix.python }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_heavy }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    env:
      DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install inference dependencies
        run: python -m pip install -r requirements.txt pytest jiwer
      - name: Run legacy WebUI tests
        run: python -m pytest -rs tests --ignore=tests/unit

  legacy-backend:
    name: Legacy backend / Python ${{ matrix.python }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_heavy }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    env:
      TEST_ENV: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-backend.txt pytest pytest-asyncio jiwer
      - name: Run legacy backend tests
        run: python -m pytest -rs backend/tests
